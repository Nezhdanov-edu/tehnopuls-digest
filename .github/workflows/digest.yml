name: Дайджест в Телеграм

on:
  schedule:
    # Время в UTC. 06:00 и 15:00 UTC = 09:00 и 18:00 по Москве.
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:   # кнопка «Run workflow» для запуска вручную

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Собрать и отправить дайджест
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python digest.py

      - name: Запомнить опубликованные новости
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Обновлён список опубликованных новостей"
          git push
