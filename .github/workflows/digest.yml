name: Дайджест в Телеграм

on:
  schedule:
    # Время в UTC. 06:00 и 15:00 UTC = 09:00 и 18:00 по Москве.
    # Публикации только по будням; праздники робот проверяет сам по производственному календарю.
    - cron: "0 6 * * 1-5"      # утренний новостной выпуск, понедельник–пятница
    - cron: "0 6 * * 0,6"      # выходные: только поздравление с праздником, если он сегодня
    - cron: "0 15 * * 1-4"     # вечерний новостной выпуск, понедельник–четверг
    - cron: "0 15 * * 5"       # пятница вечером: только афиша недели
  workflow_dispatch:   # ручной запуск: кнопка «Run workflow»
    inputs:
      afisha:
        description: "Опубликовать афишу недели прямо сейчас (обычно она выходит сама по пятницам вечером)"
        type: boolean
        default: false
      only_afisha:
        description: "Только афиша, без новостного выпуска"
        type: boolean
        default: false
      greeting:
        description: "Проверка поздравления: опубликовать, если сегодня праздник из списка (в любое время дня)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Собрать и отправить дайджест
        if: ${{ !inputs.only_afisha && github.event.schedule != '0 15 * * 5' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.greeting && '1' || '' }}
          FORCE_GREETING: ${{ inputs.greeting && '1' || '' }}
        run: python digest.py

      - name: Афиша недели (по пятницам вечером)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_PROJECT: ${{ secrets.OPENAI_PROJECT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          FORCE_EVENTS: ${{ (inputs.afisha || inputs.only_afisha) && '1' || '' }}
        run: python events.py

      - name: Запомнить опубликованные новости
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Обновлён список опубликованных новостей"
          git push
